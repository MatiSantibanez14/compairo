<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Compairo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- barra superior -->
  <div class="topbar">
    <button onclick="irLogin()">Iniciar sesión</button>
    <button onclick="irRegistro()">Registrarse</button>
  </div>

  <!-- Splash -->
  <div id="splash">
    <img src="img/logo.png" class="logo-animado">
  </div>

  <!-- Principal -->
  <div id="main" class="hidden">
    <div class="container">
      <h1>Bienvenido a Compairo 🛒</h1>

      <button onclick="irApp()">Entrar a la app</button>
    </div>
  </div>

  <script>
    // splash → main
    window.onload = function() {
      setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('main').classList.remove('hidden');
      }, 2000);
    };

    function irLogin() {
      window.location.href = "login.html";
    }

    function irRegistro() {
      window.location.href = "registro.html";
    }

    function irApp() {
      const usuario = localStorage.getItem('usuario');

      if (usuario) {
        window.location.href = "index.html";
      } else {
        window.location.href = "login.html";
      }
    }
  </script>

</body>
</html>
